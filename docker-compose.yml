services:
  api:
    build:
      context: ./backend
    environment:
      PYHINT_DATABASE_PATH: /app/data/pyhint.db
      PYHINT_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      PYHINT_LLM_ENABLED: ${PYHINT_LLM_ENABLED:-false}
      PYHINT_OPENAI_API_KEY: ${PYHINT_OPENAI_API_KEY:-}
      PYHINT_OPENAI_MODEL: ${PYHINT_OPENAI_MODEL:-gpt-5.6}
    ports:
      - "8000:8000"
    volumes:
      - pyhint-data:/app/data
    tmpfs:
      - /tmp:size=32m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped

volumes:
  pyhint-data:

